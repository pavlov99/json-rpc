name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    # Official Docker images give every interpreter, including end-of-life
    # ones (2.7, 3.6, 3.7), a uniform environment on current runners.
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - python:2.7
          - python:3.6
          - python:3.7
          - python:3.8
          - python:3.9
          - python:3.10
          - python:3.11
          - python:3.12
          - python:3.13
          - python:3.14
          - pypy:2.7
          - pypy:3.11
    env:
      DJANGO_SETTINGS_MODULE: jsonrpc.tests.test_backend_django.settings
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - uses: actions/checkout@v4

      # pip honors each package's Requires-Python, so every interpreter gets
      # the newest pytest, Django and Flask that still support it.
      - name: Install test dependencies
        run: |
          python -m pip install pytest django flask
          if python -c "import sys; sys.exit(sys.version_info[0] != 2)"; then
            python -m pip install mock  # unittest.mock is Python 3 only
          fi

      - name: Show versions
        run: |
          python --version
          python -m pip list --format=freeze | grep -iE '^(pytest|django|flask|werkzeug|mock)=='

      - name: Run tests
        run: python -m pytest -q -rs

  # Build the distributions users install, check their metadata renders on
  # PyPI, and run the test suite against the installed wheel (not the source
  # tree) to catch packaging mistakes such as missing modules.
  package:
    name: build & test wheel
    runs-on: ubuntu-latest
    container: python:3.14
    env:
      DJANGO_SETTINGS_MODULE: jsonrpc.tests.test_backend_django.settings
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: python -m pip install build twine pytest django flask

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Test installed wheel
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import jsonrpc; print('testing', jsonrpc.__file__)"
          python -m pytest -q -rs -p no:cacheprovider --pyargs jsonrpc
