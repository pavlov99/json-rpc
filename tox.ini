[tox]
envlist = py27, py3{6,7,8,9,10,11,12,13,14}, pypy, pypy3
skip_missing_interpreters = true

# Mirrors .github/workflows/tests.yml: dependencies are unpinned so that pip
# picks the newest pytest, Django and Flask that support each interpreter.
[testenv]
commands = pytest {posargs}
setenv = DJANGO_SETTINGS_MODULE=jsonrpc.tests.test_backend_django.settings
deps =
    pytest
    Django
    Flask
    py27,pypy: mock

[testenv:pycodestyle]
deps = pycodestyle
commands = pycodestyle setup.py jsonrpc --exclude=jsonrpc/six.py --show-source --show-pep8
